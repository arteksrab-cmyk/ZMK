server {
    listen 80;
    server_name xn----8sbtjdcksrjl.xn--p1ai www.xn----8sbtjdcksrjl.xn--p1ai;

    root /var/www/zmk/artifacts/zmk-sms-resurs/dist/public;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xn----8sbtjdcksrjl.xn--p1ai www.xn----8sbtjdcksrjl.xn--p1ai;

    root /var/www/zmk/artifacts/zmk-sms-resurs/dist/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/xn----8sbtjdcksrjl.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbtjdcksrjl.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
