openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead submission operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a project request
      description: Sends a project request and optional project files to the configured business mailbox. Attach up to 5 PDF or Word files, with a combined size no greater than 18 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LeadSubmissionInput"
      responses:
        "200":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSubmissionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Attachment request exceeds the supported size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadSubmissionInput:
      type: object
      required:
        - name
        - company
        - phone
        - email
        - details
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        company:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 80
        email:
          type: string
          maxLength: 254
        details:
          type: string
          maxLength: 4000
        files:
          type: array
          maxItems: 5
          description: Optional PDF or Word project files, up to 18 MB combined.
          items:
            type: string
            format: binary
    LeadSubmissionResult:
      type: object
      properties:
        status:
          type: string
          enum: [sent]
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

